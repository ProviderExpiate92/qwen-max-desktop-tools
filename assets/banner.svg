<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="35%" stop-color="#101828"/>
      <stop offset="70%" stop-color="#1a1f3a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#4f8cff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.75" r="0.5">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8cff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4f8cff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4f8cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a371f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#glow1)"/>
  <rect width="1200" height="360" fill="url(#glow2)"/>

  <!-- Decorative grid lines -->
  <line x1="0" y1="90" x2="1200" y2="90" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="180" x2="1200" y2="180" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="270" x2="1200" y2="270" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Decorative vertical lines -->
  <line x1="150" y1="0" x2="150" y2="360" stroke="#4f8cff" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="360" stroke="#4f8cff" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="1050" y1="0" x2="1050" y2="360" stroke="#4f8cff" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="50" r="2" fill="#4f8cff" fill-opacity="0.4"/>
  <circle cx="1100" cy="60" r="1.5" fill="#a371f7" fill-opacity="0.4"/>
  <circle cx="200" cy="310" r="1.5" fill="#4f8cff" fill-opacity="0.3"/>
  <circle cx="950" cy="300" r="2" fill="#a371f7" fill-opacity="0.3"/>
  <circle cx="80" cy="180" r="1" fill="#ffffff" fill-opacity="0.2"/>
  <circle cx="1120" cy="170" r="1" fill="#ffffff" fill-opacity="0.2"/>

  <!-- Decorative path -->
  <path d="M0,200 Q300,160 500,210 T1000,190 T1200,210" fill="none" stroke="#4f8cff" stroke-opacity="0.08" stroke-width="1.5"/>
  <path d="M0,230 Q350,260 550,220 T1000,240 T1200,220" fill="none" stroke="#a371f7" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- Top accent line -->
  <rect x="350" y="0" width="500" height="2" fill="url(#accentLine)"/>

  <!-- Headline decoration - small brackets -->
  <path d="M480,145 L470,155 L470,175 L480,185" fill="none" stroke="#4f8cff" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M720,145 L730,155 L730,175 L720,185" fill="none" stroke="#4f8cff" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Headline -->
  <text x="600" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="52.0" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <tspan x="600" dy="0">Qwen 3.5 Max Desktop</tspan>
    <tspan x="600" dy="52">JailBreak</tspan>
  </text>

  <!-- Divider line -->
  <rect x="480" y="218" width="240" height="1" fill="url(#lineGrad)"/>

  <!-- Tagline -->
  <text x="600" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" fill="#c9d1d9" text-anchor="middle">
    <tspan x="600" dy="0">Companion tools for Qwen 3.5 Max Desktop users —</tspan>
    <tspan x="600" dy="28">organize local sessions and manage model configs.</tspan>
  </text>

  <!-- Bottom accent line -->
  <rect x="350" y="358" width="500" height="2" fill="url(#accentLine)"/>
</svg>